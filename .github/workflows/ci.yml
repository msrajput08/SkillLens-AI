name: SkillLens CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install app and tests
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q app tests
      - name: Full suite
        env:
          SKILLLENS_ENV: development
        run: python -m pytest -q
