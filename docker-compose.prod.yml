# Production-oriented single-server compose, with automatic HTTPS via Caddy.
# Configure .env.production from .env.production.example; never commit secrets.
services:
  app:
    build: .
    env_file: .env.production
    command: sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-access-log'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://skilllens:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}@db:5432/skilllens
      SKILLLENS_ENV: production
    expose:
      - '8000'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  janitor:
    build: .
    env_file: .env.production
    command: sh -c 'while true; do python -m app.cleanup; sleep 86400; done'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://skilllens:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}@db:5432/skilllens
      SKILLLENS_ENV: production
    restart: unless-stopped
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skilllens
      POSTGRES_USER: skilllens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skilllens -d skilllens']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set_PUBLIC_DOMAIN}
    depends_on:
      - app
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  clamav_db:
